{% extends "base.html" %}

{% block content %}
    <div class="centered container">
        <h2>Posts</h2>
        <div class="post-overview">
            {% if posts %}
                {% for post in posts %}
                    <div class="post">
                        <a href="{{url_for('profile', username=post.author_username)}}">
                            <div class="post-profile-link">
                                <!-- if errors occur when adding avatars, try removing this img (filename post.author_username.avatar) -->
                                <img class="avatar" src="{{ url_for('static', filename=post.author_username.avatar or 'user-avatar.jpg') }}">
                                <p>{{post.author_username}}</p>
                            </div>
                        </a>
                        <p class="post-date">{{ post.created_at.strftime('%d %B %Y %H:%M') }}</p>
                        <p>{{ post.content }}</p>
                    </div>
                {% endfor %}
            {% else %}
                <h3 class="no-posts">No posts</h3>
            {% endif %}
        </div>
    </div>
{% endblock %}
