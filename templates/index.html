{% extends "base.html" %}

{% block content %}
    <div class="centered container">
        {% if current_user %}
            <p>Hi, {{ current_user }}!</p>
        {% endif %}

        <h2>Profiles</h2>
        {% for user in all_users %}
            <p>
                <a href="{{ url_for('profile', username=user.username) }}">
                    {{ user.username }}
                </a>
            </p>
        {% else %}
            <p>No users found.</p>
        {% endfor %}
    </div>
{% endblock %}
