<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>
</head>

<body>
    <nav>
        <div class="centered navigation">
            <a class="home-text" href="{{ url_for('index') }}"><h1>Social Media</h1></a>
            {% if session.get('name') %}
                <div>
                    <a class="home-button" href="{{ url_for('index') }}"><button>Home</button></a>
                    <a href="{{url_for('users')}}"><button>Users</button></a>
                    <a class="above-370px" href="{{url_for('profile', username=session['name'])}}"><button>My profile</button></a>
                    <a class="under-370px" href="{{url_for('profile', username=session['name'])}}"><button>Me</button></a>
                    <a href="{{url_for('logout')}}"><button>Logout</button></a>
                </div>
            {% else %}
                <a href="{{url_for('login')}}"><button>Login</button></a>
            {% endif %}
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
