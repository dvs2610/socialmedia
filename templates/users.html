{% extends "base.html" %}

{% block content %}
    <div class="centered container">
        <h2>Profiles</h2>
        <div class="grid-profiles">
            {% if users %}
                {% for user in users %}
                    <a href="{{ url_for('profile', username=user.username) }}">
                        <div class="profile-preview">
                            <img class="profile-pic" src="{{ url_for('static', filename='profile_pics/' ~ (user.profile_pic or 'profile-pic.jpg')) }}">
                            <h3>{{ user.username }}</h3>
                        </div>
                    </a>
                {% endfor %}
            {% else %}
                <p>No users found.</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
